name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: monitoring_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d monitoring_test" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done
      - name: Run migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/monitoring_test
        run: |
          python -c "from src.multi_agent_team.monitoring.migrate import run_migrations; run_migrations()"
      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/monitoring_test
          MONITORING_JWT_SECRET: tests3cret
        run: |
          pytest -q
name: Multi-Agent Team CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: ruff check src tests
      - run: pytest -q
